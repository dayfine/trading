# Tier-1 perf smoke: per-PR fast smoke (≤2 min budget) for the perf catalog.
#
# Runs every scenario tagged `;; perf-tier: 1` under
# trading/test_data/backtest_scenarios/ via dev/scripts/perf_tier1_smoke.sh,
# captures wall-time + peak RSS, and writes the result into the GHA job
# summary so reviewers can read off perf at a glance.
#
# Tier-1 is the per-PR gate: continue-on-error: false (strict). Per-cell
# budgets aren't pinned yet, but the smoke MUST pass — i.e. every tier-1
# scenario must complete without crashing inside the 120 s/cell timeout.
# Once budgets are pinned (~10 PR cycles of real data per
# dev/plans/perf-scenario-catalog-2026-04-25.md tier 1), the wall +
# peak-RSS thresholds add a second layer of regression detection on top
# of the smoke pass.
#
# Tier-2 (perf-nightly.yml) and tier-3 (perf-weekly.yml) keep
# continue-on-error: true for now — they're VISIBILITY-first while
# their budgets warm up (~10 weeks / ~10 weekly cycles of data).
#
# Per-cell logs/RSS/wall files are uploaded as a run artefact and FAIL rows
# are promoted to the job summary + GHA `::warning::` annotations (issue
# #2891; artifact upload for tier2/tier3 shipped first in #2894) — a FAIL
# row used to be both invisible on the run page and undiagnosable after the
# fact once the runner tore down.
#
# Tier-1 scenarios covered (kept in sync via trading/devtools/checks/perf_catalog_check.sh):
#   trading/test_data/backtest_scenarios/perf-sweep/bull-3m.sexp
#   trading/test_data/backtest_scenarios/perf-sweep/bull-6m.sexp
#   trading/test_data/backtest_scenarios/smoke/panel-golden-2019-full.sexp
#   trading/test_data/backtest_scenarios/smoke/tiered-loader-parity.sexp
name: perf-tier1

on:
  pull_request:
  push:
    branches: [main]

jobs:
  perf-tier1-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/trading-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    env:
      HOME: /home/opam
      TRADING_IN_CONTAINER: "1"
      TRADING_DATA_DIR: ${{ github.workspace }}/trading/test_data
    steps:
      - uses: actions/checkout@v4

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: trading/_build
          key: dune-${{ runner.os }}-${{ hashFiles('trading/**/*.opam', 'trading/**/dune', 'trading/**/dune-project', 'trading/**/*.ml', 'trading/**/*.mli') }}

      - name: Run tier-1 perf smoke
        id: tier1
        continue-on-error: false
        run: dev/scripts/perf_tier1_smoke.sh

      # FAIL rows promoted above the full table + into GHA annotations, via
      # the shared parser (dev/lib/perf_fail_rows.sh, #2891) all three perf
      # workflows use -- see that file's header for the summary.txt shape.
      - name: Surface perf FAIL rows
        if: always()
        run: |
          # shellcheck disable=SC1091  # relative to $GITHUB_WORKSPACE at runtime; shellcheck can't follow it statically
          . dev/lib/perf_fail_rows.sh
          summary_file=$(find dev/perf -maxdepth 2 -path 'dev/perf/tier1-smoke-*/summary.txt' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -n "$summary_file" ] && [ -f "$summary_file" ]; then
            _perf_write_fail_summary "$summary_file" "Tier-1 perf smoke" >>"$GITHUB_STEP_SUMMARY"
            _perf_emit_fail_annotations "$summary_file" "perf-tier1-smoke-${{ github.run_id }}"
          fi

      - name: Publish summary
        if: always()
        run: |
          summary_file=$(find dev/perf -maxdepth 2 -path 'dev/perf/tier1-smoke-*/summary.txt' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -n "$summary_file" ] && [ -f "$summary_file" ]; then
            {
              echo "## Tier-1 perf smoke"
              echo ""
              echo '```'
              cat "$summary_file"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Tier-1 perf smoke: no summary produced." >>"$GITHUB_STEP_SUMMARY"
          fi

      # Per-cell logs + peak_rss/wall_sec files. Without this a FAIL row was
      # undiagnosable: the cell's stdout/stderr goes to <cell>.log, which
      # never reached the workflow log -- same defect as tier2/tier3 (#2894),
      # never fixed for tier1 (#2891).
      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-tier1-smoke-${{ github.run_id }}
          path: dev/perf/tier1-smoke-*/
          retention-days: 14
          if-no-files-found: warn
