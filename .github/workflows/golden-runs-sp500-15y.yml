# SP500 15y golden-run: runs EVERY perf-tier-3 scenario under
# goldens-sp500-historical/ on a nightly cron — as of 2026-08 that is
# three sequential scenarios: sp500-2010-2026, sp500-2010-2026-longshort
# (#1050), and sp500-2011-2026-bah-brk-b (#1166).
#
# Split out of golden-runs-sp500.yml on 2026-05-08 because the 15y
# scenario currently OOMs on 8 GB GHA runners (peak RSS ~11.4 GB,
# wall ~43 min). See dev/notes/next-session-priorities-2026-05-08.md
# §Q1 and §Q4. Once the memory cliff is fixed and the run reliably
# completes within budget, this workflow can be promoted back to a
# per-push trigger.
#
# Graduated from soak 2026-08-31 (#2403): continue-on-error flipped to false
# after 9 consecutive clean runs since 2026-08-23 (latest wall 165 min,
# 09:14->11:59 UTC, on the post-#2601 --no-emit-all-eligible basis). Failure
# here now surfaces as a real check on the run; see issue #2403 comment log
# for the flip condition and evidence.
#
# Prerequisite: bar data for the SP500 universe (full history back to
# ~2009) must be committed under trading/test_data/.
#
# Expected runtime (post-Q1 fix target): ~45 min wall, ≤2 GB peak RSS.
# Pre-fix: 43 min wall, 11.4 GB peak (OOMs on 8 GB runner).
#
# Trigger:
#   - cron: 09:00 UTC daily (= 02:00 PT) — after most local work is done
#   - workflow_dispatch for manual reruns
name: golden-runs-sp500-15y

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  golden-sp500-15y:
    runs-on: ubuntu-latest
    # 240 min: the job runs three ~55-min scenarios sequentially. The old
    # 90-min cap fitted only the original single scenario; when #1050 added
    # the long-short golden (2026-05-12) every subsequent run was cancelled
    # at the cap — 96+ consecutive silent cancellations (#2427).
    # Raised 240 -> 600 (2026-08-25, #2537): the two 15y strategy cells
    # MEASURE 90-102 min per cell locally (backtest proper is only
    # ~430-470s; the bulk is the all_eligible diagnostic scanning 852
    # Fridays), so 70 min/cell was structurally unreachable and every
    # completed run since at least 08-23 timed out both cells.
    # Retightened 600 -> 300 (2026-08-31, #2403): sized empirically off the
    # post-#2601 (--no-emit-all-eligible) streak — walls 165-175.5 min over
    # the 9-run green streak, so 300 gives ~1.7x headroom over the streak
    # MAX. (Attribution caveat from the qc-behavioral review: cells still
    # measure ~80-85 min each with the flag on, so the #2537 "the bulk is
    # all_eligible" causal story overstated; the empirical wall, not the
    # attribution, is the basis for 300.)
    # COHERENCE INVARIANT (qc-behavioral on #2615): the job cap must bound
    # the script's own worst case, or a hung cell turns into a job-level
    # cancel that skips the if:always() no-summary net below (#2427's
    # silent-failure shape). With GOLDEN_SP500_TIMEOUT=7200 (120 min/cell,
    # retightened in the same review): two heavy cells hung = 240 min + the
    # ~13s third cell + overhead ~= 243 min < 300. Keep
    # per_cell * n_cells + overhead <= timeout-minutes when touching either.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/trading-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    env:
      HOME: /home/opam
      TRADING_IN_CONTAINER: "1"
      TRADING_DATA_DIR: ${{ github.workspace }}/trading/test_data
      # Restrict to 15y historical goldens.
      GOLDEN_SP500_SUBDIRS: goldens-sp500-historical
      # Per-cell timeout (seconds). Measured 2026-08-25 (#2537): the two
      # 15y cells take 5374s / 6127s locally end-to-end (GNU-time peak RSS
      # ~745MB per cell). The 12.4GB figures in older kill reports are NOT
      # an unexplained separate RSS surface — they are the #2553 digit-fusion
      # bug: `rss_value=$(tr -d '\n' <"$rss_path")` fused GNU time's leading
      # "Command exited with non-zero status 1" line onto the %M value on
      # FAILING cells, e.g. real 745192 kB reading as ...1745192-shaped
      # output. Those 2026-08-24/25 runs predate the #2549 artifact-upload
      # fix, so the raw peak_rss files are gone and the true figure is
      # unverifiable now; a "1" + a ~745MB-scale value would put it around
      # ~1.7-2.4 GB, not 12.4 GB. See #2553, #2559,
      # .claude/rules/container-capacity-scheduling.md
      # "Pre-#2553 kill-report RSS figures are suspect on failing cells".
      # Retightened 14400 -> 7200 (2026-08-31, #2615 qc-behavioral): the
      # 4h/cell value was sized for the all_eligible-era 90-102 min cells
      # and only coheres with the OLD 600-min job cap (one hang = 328 min,
      # two = 483 — both < 600). At the new 300-min cap a 240-min hung cell
      # left ~57 min for a ~85-min sibling -> job-level cancel mid-cell-2,
      # which skips the if:always() no-summary net (#2427's silent shape).
      # 120 min/cell is ~1.4x the 80-85 min measured post-#2601 GHA cells
      # and keeps the worst case (two heavy hangs ~= 243 min incl. the 13s
      # cell + overhead) inside the 300-min cap above.
      GOLDEN_SP500_TIMEOUT: "7200"
    steps:
      - uses: actions/checkout@v4

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: trading/_build
          key: dune-${{ runner.os }}-${{ hashFiles('trading/**/*.opam', 'trading/**/dune', 'trading/**/*.ml', 'trading/**/*.mli') }}

      - name: Run SP500 15y golden
        id: golden_sp500_15y
        continue-on-error: false
        run: dev/scripts/golden_sp500_postsubmit.sh

      - name: Publish summary
        if: always()
        run: |
          summary_file=$(ls -1t dev/perf/golden-sp500-postsubmit-*/summary.txt 2>/dev/null | head -1)
          if [ -n "$summary_file" ] && [ -f "$summary_file" ]; then
            {
              echo "## SP500 15y golden run"
              echo ""
              echo '```'
              cat "$summary_file"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            # The script writes summary.txt UNCONDITIONALLY after its
            # scenario loop — cells that FAIL or hit the per-cell timeout
            # still land there as FAIL rows; that per-cell accounting is
            # internal to golden_sp500_postsubmit.sh and independent of the
            # step-level continue-on-error above (graduated to false
            # 2026-08-31, #2403 — a script-level failure now fails the job,
            # which is the point of graduating out of soak). A MISSING
            # summary therefore means the script died before finishing the
            # loop; fail the job so that outage is visible instead of the
            # silent green this branch used to report (#2427). The
            # job-timeout case is separate: a job-level cancel yields
            # conclusion=cancelled regardless of step exit codes, and it
            # SKIPS this if:always() branch entirely — no cap "fixes" it;
            # it is prevented only by the coherence invariant at
            # timeout-minutes (per_cell * n_cells + overhead <= job cap,
            # currently 7200s-per-cell vs 300 min).
            echo "SP500 15y golden run: no summary produced." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Upload run artefacts (equity_curve.csv, splits.csv, trades.csv, actual.sexp,
      # progress.sexp, summary.sexp) so postmortem analysis after a FAIL doesn't
      # require re-running the 50-minute scenario.  Retain 7 days — long enough
      # to investigate, short enough to keep storage usage low.  See
      # `dev/notes/15y-split-day-regression-2026-05-08.md` §"Fix-path" for how
      # these are used.
      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-sp500-15y-${{ github.run_id }}
          path: |
            dev/perf/golden-sp500-postsubmit-*/
            **/dev/backtest/scenarios-*/sp500-2010-2026-historical/
          retention-days: 7
          if-no-files-found: warn
