# SP500 15y golden-run: runs EVERY perf-tier-3 scenario under
# goldens-sp500-historical/ on a nightly cron — as of 2026-08 that is
# three sequential scenarios: sp500-2010-2026, sp500-2010-2026-longshort
# (#1050), and sp500-2011-2026-bah-brk-b (#1166).
#
# Split out of golden-runs-sp500.yml on 2026-05-08 because the 15y
# scenario currently OOMs on 8 GB GHA runners (peak RSS ~11.4 GB,
# wall ~43 min). See dev/notes/next-session-priorities-2026-05-08.md
# §Q1 and §Q4. Once the memory cliff is fixed and the run reliably
# completes within budget, this workflow can be promoted back to a
# per-push trigger.
#
# Non-blocking by design: continue-on-error: true. Failure here does
# not gate merges; it surfaces as a nightly signal that 15y regressed.
#
# Prerequisite: bar data for the SP500 universe (full history back to
# ~2009) must be committed under trading/test_data/.
#
# Expected runtime (post-Q1 fix target): ~45 min wall, ≤2 GB peak RSS.
# Pre-fix: 43 min wall, 11.4 GB peak (OOMs on 8 GB runner).
#
# Trigger:
#   - cron: 09:00 UTC daily (= 02:00 PT) — after most local work is done
#   - workflow_dispatch for manual reruns
name: golden-runs-sp500-15y

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  golden-sp500-15y:
    runs-on: ubuntu-latest
    # 240 min: the job runs three ~55-min scenarios sequentially. The old
    # 90-min cap fitted only the original single scenario; when #1050 added
    # the long-short golden (2026-05-12) every subsequent run was cancelled
    # at the cap — 96+ consecutive silent cancellations (#2427).
    # Raised 240 -> 600 (2026-08-25, #2537): the two 15y strategy cells
    # MEASURE 90-102 min per cell locally (backtest proper is only
    # ~430-470s; the bulk is the all_eligible diagnostic scanning 852
    # Fridays), so 70 min/cell was structurally unreachable and every
    # completed run since at least 08-23 timed out both cells. Worst case
    # now: 2 x 240 min + bah + build ~= 520 min, inside the cap.
    timeout-minutes: 600
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/trading-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    env:
      HOME: /home/opam
      TRADING_IN_CONTAINER: "1"
      TRADING_DATA_DIR: ${{ github.workspace }}/trading/test_data
      # Restrict to 15y historical goldens.
      GOLDEN_SP500_SUBDIRS: goldens-sp500-historical
      # Per-cell timeout (seconds). Measured 2026-08-25 (#2537): the two
      # 15y cells take 5374s / 6127s locally end-to-end (true RSS ~1.7GB —
      # the 12.4GB figures in older kill reports were mmap-inflated RSS).
      # GHA runners are typically slower, so 4h/cell; the 600-min job cap
      # above still bounds two pathological hangs.
      GOLDEN_SP500_TIMEOUT: "14400"
    steps:
      - uses: actions/checkout@v4

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: trading/_build
          key: dune-${{ runner.os }}-${{ hashFiles('trading/**/*.opam', 'trading/**/dune', 'trading/**/*.ml', 'trading/**/*.mli') }}

      - name: Run SP500 15y golden
        id: golden_sp500_15y
        continue-on-error: true
        run: dev/scripts/golden_sp500_postsubmit.sh

      - name: Publish summary
        if: always()
        run: |
          summary_file=$(ls -1t dev/perf/golden-sp500-postsubmit-*/summary.txt 2>/dev/null | head -1)
          if [ -n "$summary_file" ] && [ -f "$summary_file" ]; then
            {
              echo "## SP500 15y golden run"
              echo ""
              echo '```'
              cat "$summary_file"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            # The script writes summary.txt UNCONDITIONALLY after its
            # scenario loop — cells that FAIL or hit the per-cell timeout
            # still land there as FAIL rows, which is the soak policy
            # (continue-on-error above) working as intended. A MISSING
            # summary therefore means the script died before finishing the
            # loop; fail the job so that outage is visible instead of the
            # silent green this branch used to report (#2427). The
            # job-timeout case is separate: a job-level cancel yields
            # conclusion=cancelled regardless of step exit codes — that
            # case is fixed by the 240-min cap above, not by this exit.
            echo "SP500 15y golden run: no summary produced." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Upload run artefacts (equity_curve.csv, splits.csv, trades.csv, actual.sexp,
      # progress.sexp, summary.sexp) so postmortem analysis after a FAIL doesn't
      # require re-running the 50-minute scenario.  Retain 7 days — long enough
      # to investigate, short enough to keep storage usage low.  See
      # `dev/notes/15y-split-day-regression-2026-05-08.md` §"Fix-path" for how
      # these are used.
      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-sp500-15y-${{ github.run_id }}
          path: |
            dev/perf/golden-sp500-postsubmit-*/
            **/dev/backtest/scenarios-*/sp500-2010-2026-historical/
          retention-days: 7
          if-no-files-found: warn
