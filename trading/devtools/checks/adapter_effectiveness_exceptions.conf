# Exceptions for adapter_effectiveness_check.sh (silent-null config-thread
# guard, issue #2567).
#
# Format: one field name per line (the SOURCE field name on the
# right-hand "config.<field>" side of the copy -- i.e. the strategy- or
# sub-config-level field being threaded), followed by a MANDATORY
# trailing "  # review_at: <value>" annotation, same convention as
# universe_deps_exceptions.conf / linter_exceptions.conf. <value> is one
# of:
#   never              -- intentionally permanent (rare for this file --
#                          almost every entry here should get a real pin
#                          eventually); may be followed by free text in
#                          parens.
#   M1..M7             -- re-review when that milestone lands.
#   YYYY-MM-DD         -- re-review after that date.
# Blank lines and lines starting with '#' are ignored. An entry with NO
# review_at annotation, or one that doesn't parse as one of the three
# forms above, is a hard FAIL from adapter_effectiveness_check.sh itself
# -- an unconstrained exceptions file would silently disable the guard
# for that field forever.
#
# Every entry below is a field the 2026-08-28 census
# (dev/plans/silent-null-effectiveness-2026-08-28.md) found ALREADY
# threaded on main, predating this check. They are grandfathered here
# rather than blocking the PR that introduced the check; the review_at
# dates are when to come back and either add a real EFFECTIVENESS-PIN
# test or re-justify the exception.

neutral_blocks_longs  # review_at: 2026-10-01 (screener cascade gate; test_screener.ml tests Screener.config directly, not yet the Weinstein_strategy_config thread via _run_screener)
neutral_blocks_shorts  # review_at: 2026-10-01 (same thread as neutral_blocks_longs, _run_screener)
# NOTE: enable_slow_grind_short_gate is threaded at the SAME _run_screener
# site (weinstein_strategy_screening.ml) but its "field =" and
# "config.field2" halves are ocamlfmt-split across two lines, so the
# check's single-line regex never counts it at all -- it is not an
# active exceptions entry because it never reaches Step 3. Recorded here
# only so the 2026-10-01 audit of this file's sibling entries also picks
# it up by hand. See adapter_effectiveness_check.sh's header for the
# multi-line residual this documents.
stop_width_mode  # review_at: 2026-10-01 (entry_stop_width_order.ml + entry_walk.ml both copy this field; needs one thread-level test covering both sites)
stop_width_size_down_max_pct  # review_at: 2026-10-01 (paired with stop_width_mode, same two sites)
match_fraction  # review_at: 2026-10-13 (snapshot/gen rename_detector.ml -- offline tooling, lower blast radius than a live strategy mechanism, but still unaudited)
ret_epsilon  # review_at: 2026-10-13 (same file as match_fraction, same reason)
require_breakout_volume  # review_at: 2026-10-01 (stock_analysis.ml's OWN inner thread into Volume.config; the OUTER Weinstein_strategy_config -> Stock_analysis.config thread is already pinned via test_armed_f5_waives_screen_time_volume_gate, but that does not exercise this inner site)
