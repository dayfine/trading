nesting devtools/magic_numbers_linter  Hand-rolled char-level lexer/PCRE-backtracking port of the removed linter_magic_numbers.sh (has_let_binding, try_match_at, scan_file_lines, scan_file, collect_lib_ml_files, read_magic_number_exclusions); the branching mirrors the shell script's case/grep logic and is pinned byte-for-byte by test/test_magic_numbers_linter_lib.ml -- restructuring risks silently changing detection, which the PR #2272 CP2 rework specifically had to avoid. Pre-existing in the single-file version before the CP1/CP2 rework split it into lib/ (verified: same 6 functions, same complexity, tripped the check there too -- it just wasn't in a lib/*.ml path yet so the check never ran on it).  # review_at: 2026-11-09 (next dedicated devtools nesting-reduction pass)

arch_layer analysis/scripts/stage_chart  Diagnostic viz tool replays the Weinstein_stops state machine to draw the true trailing stop; uses Trading_base.Types.position_side (shared Long | Short domain variant) + weinstein_trading.stops. Not trading-core logic embedded in analysis.  # review_at: never (diagnostic visualization tool)

# ── tracked_artifact ─────────────────────────────────────────────────────────
# Path prefixes for files that are BOTH tracked in git AND matched by a
# .gitignore pattern, allow-listed as deliberate (not the #2248 accidental-
# build-artifact bug class). See tracked_artifact_linter.sh header for the
# full rationale and how this list was derived (verified against
# `git ls-files -i -c --exclude-standard` on 2026-08-09: these 8 prefixes
# account for all 1334 current hits, 0 unaccounted).
#
# NOTE on match semantics: the file header above (line 5) describes the
# general convention as "excluded if its path contains the substring" --
# true for the `magic_numbers` / `mli_coverage` / `nesting` / `arch_layer`
# entries above. `tracked_artifact` entries are the one exception: this
# linter matches with an ANCHORED PREFIX (`^<prefix>`), not a substring
# search anywhere in the path -- see tracked_artifact_linter.sh's
# ALLOW_PATTERN construction. The divergence is in the stricter/safer
# direction (a mid-path substring match can't accidentally allow-list an
# unrelated file), but don't assume substring behaviour when adding a new
# `tracked_artifact` entry here.

tracked_artifact trading/test_data/  Deliberately committed golden OHLCV bars used by CI-run tests without an API key; the matching .gitignore pattern (trading/test_data/**/data.csv) protects only NEW ad-hoc fetches, per its own comment ("Already-tracked golden bars are UNAFFECTED").  # review_at: never (documented, permanent data-fixture convention)

