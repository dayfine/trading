# ── sexp_default_drift ────────────────────────────────────────────────────────
# Catches a record type declared more than once (an .mli re-declaring another
# module's record via [include], or an ordinary .ml/.mli pair) where the SAME
# field carries a DIFFERENT [@sexp.default ...] value across declarations --
# see devtools/sexp_default_drift_linter/sexp_default_drift_linter.ml header.
#
# Match semantics differ from every other section above: the key is
# "<type_name>.<field_name>" (an EXACT match, not a path substring -- field
# granularity is the point; a substring match here could accidentally
# silence an unrelated field of the same name in a different record).
#
# The linter already filters out the common, intentional case where a
# module's .mli simply never repeats [@sexp.default] for a whole type (most
# of this repo's config-record .mli's do this; it is a style choice, not
# drift -- see the linter header's "opted-in" comment). Only PARTIAL
# adoption -- the type IS documented with defaults in this .mli, but this
# ONE field's attribute was dropped -- reaches this file.
#
# margin_config.mli's t.short_borrow_rate_tiers / t.short_maintenance_tiers
# were the two entries here (review_at: 2026-09-20, expired) -- retired
# 2026-09-24 by adding the matching [@sexp.default []] to both fields in
# the .mli, which is what margin_config.ml already carried. No behavior
# change; the linter now finds the two declarations agree.
