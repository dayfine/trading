# Exceptions for check_universe_deps.sh (H-CHECK-CACHE-BLIND guard).
#
# Format: one bare script filename per line (matches the basename of a
# trading/devtools/checks/*.sh script that calls repo_root()), optionally
# followed by a trailing comment. Blank lines and lines starting with '#'
# are ignored.
#
# A script belongs here ONLY if manual audit proved its repo_root()-derived
# reads are either (a) already covered by other explicit deps on the same
# dune rule, or (b) always overridden to a synthetic fixture and never
# touch the real outside-workspace file. Do NOT add an entry just to make
# the guard pass -- see .claude/rules/code-health-discipline.md. Each entry
# below must be self-evident from the referenced dune rule's comment.

# Reads deep_scan/check_05_followup_items.sh and
# deep_scan/check_08_trends.sh via repo_root(), but both paths are already
# declared as explicit deps on the same dune rule, and the rule always
# invokes them with REPO_ROOT overridden to a synthetic fixture tree (see
# the dune file's "H-CHECK-CACHE-BLIND exemption" comment on this rule).
deep_scan_followup_count_check.sh

# Defines a private _repo_root() (not the shared _check_lib.sh helper) and
# uses it to locate dev/reviews/ and dev/audit/. Governed by
# record_qc_audit_test.sh's dune rule, which ALWAYS overrides REPO_ROOT to
# a freshly-created temp fixture repo before invoking this script -- the
# real dev/reviews/ and dev/audit/ directories are never read. See the
# dune file's "H-CHECK-CACHE-BLIND exemption" comment on that rule.
record_qc_audit.sh

# Same governing rule and same exemption evidence as record_qc_audit.sh
# above (both are deps of record_qc_audit_test.sh's rule, always run
# under a REPO_ROOT override pointing at a temp fixture repo).
write_audit.sh
