# Exceptions for check_universe_deps.sh (H-CHECK-CACHE-BLIND guard).
#
# Format: one script entry per line -- the script's path relative to
# trading/devtools/checks/ (bare filename for a top-level script, e.g.
# "record_qc_audit.sh"; path-qualified for a subdirectory script, e.g.
# "deep_scan/_lib.sh") followed by a MANDATORY trailing
# "  # review_at: <value>" annotation, same convention as
# linter_exceptions.conf. <value> is one of:
#   never              -- intentionally permanent (structural fact, not
#                          time- or milestone-bound); may be followed by
#                          free text in parens, e.g. "never (reason)".
#   M1..M7             -- re-review when that milestone lands (see
#                          docs/design/weinstein-trading-system-v2.md).
#   YYYY-MM-DD         -- re-review after that date.
# Blank lines and lines starting with '#' are ignored. An entry with NO
# review_at annotation, or one that doesn't parse as one of the three
# forms above, is a hard FAIL from check_universe_deps.sh itself -- this
# is the #2148 FLAG-1 fix: an unconstrained exceptions file silently
# disables the guard for a script forever, with nothing enforcing that
# the exemption is ever revisited. The weekly deep scan
# (deep_scan/check_11_linter_expiry.sh) separately reports entries whose
# review_at has actually expired, mirroring the linter_exceptions.conf
# precedent.
#
# A script belongs here ONLY if manual audit proved its repo_root()-derived
# reads are either (a) already covered by other explicit deps on the same
# dune rule, or (b) always overridden to a synthetic fixture and never
# touch the real outside-workspace file, or (c) the script is provably
# never a dune run-target or dep at all (invoked outside `dune runtest`
# by construction). Do NOT add an entry just to make the guard pass -- see
# .claude/rules/code-health-discipline.md. Each entry below must be
# self-evident from the referenced dune rule's comment (or, for case (c),
# from the script's own invocation story).

# Reads deep_scan/check_05_followup_items.sh and
# deep_scan/check_08_trends.sh via repo_root(), but both paths are already
# declared as explicit deps on the same dune rule, and the rule always
# invokes them with REPO_ROOT overridden to a synthetic fixture tree (see
# the dune file's "H-CHECK-CACHE-BLIND exemption" comment on this rule).
deep_scan_followup_count_check.sh  # review_at: never (architectural invariant of the rule's fixture-override wiring, not time-bound)

# Defines a private _repo_root() (not the shared _check_lib.sh helper) and
# uses it to locate dev/reviews/ and dev/audit/. Governed by
# record_qc_audit_test.sh's dune rule. Every invocation of this script in
# that test takes one of three shapes: (a) REPO_ROOT explicitly overridden
# to a freshly-created temp fixture repo; (b) REPO_ROOT overridden to a
# deliberately malformed value (nonexistent path / regular file), which
# _repo_root()'s `[ -d ]` guard rejects with a hard error before any path
# is computed; or (c) the walk-up branch, reached either via
# `env -u REPO_ROOT` or via REPO_ROOT='' (which _repo_root() treats as
# unset -- e.g. scenarios 27b/28b/29c/30c/31c), from a copy of the script
# located inside a temp fixture that carries its own `.claude` sentinel.
# The walk-up seeds from the script's own directory (`dirname "$0"`), not
# the caller's CWD, so it terminates inside the fixture regardless of
# where the test runs from. In every case, the real dev/reviews/ and
# dev/audit/ directories are never read. See the dune file's
# "H-CHECK-CACHE-BLIND exemption" comment on that rule.
record_qc_audit.sh  # review_at: never (architectural invariant of the rule's fixture-override wiring, not time-bound)

# Same governing rule as record_qc_audit.sh above, and the same
# three-shape exemption evidence: every invocation in
# record_qc_audit_test.sh either (a) overrides REPO_ROOT to a freshly-
# created temp fixture repo, (b) overrides REPO_ROOT to a deliberately
# malformed value that _repo_root()'s `[ -d ]` guard hard-errors on before
# computing any path, or (c) reaches the walk-up branch -- via
# `env -u REPO_ROOT` or via REPO_ROOT='' (treated as unset) -- from a copy
# of the script located inside a temp fixture that carries its own
# `.claude` sentinel, e.g. scenarios 27b/28b/30c/31c. The walk-up
# terminates inside the fixture regardless of caller CWD (it seeds from
# the script's own location), never the real repo.
write_audit.sh  # review_at: never (same evidence as record_qc_audit.sh above)

# Sourced by every deep_scan/check_*.sh script; its own repo_root() call
# sets REPO_ROOT/TRADING_DIR for whichever script sourced it. Two dune
# rules list this file as a dep -- deep_scan_followup_count_check.sh's
# rule and deep_scan_rework_streak_check.sh's rule (see each rule's own
# "H-CHECK-CACHE-BLIND exemption" comment in the dune file) -- and BOTH
# always invoke their target scripts with REPO_ROOT overridden to a
# synthetic fixture tree, so the exemption evidence holds for either.
# This entry exempts the candidate script itself (check_universe_deps.sh
# skips by script name, not per-rule), so which/how many rules reference
# it does not change the exemption. Added when check_universe_deps.sh's
# candidate scan became recursive (#2148 FLAG-2); not mis-covered before
# that fix, just invisible to the old top-level-only scan.
deep_scan/_lib.sh  # review_at: never (same governing rule and evidence as deep_scan_followup_count_check.sh above)

# Deep-scan orchestrator entrypoint (invoked as `sh deep_scan/main.sh`, or
# via the deep_scan.sh shim, run weekly by a human/orchestrator -- never by
# `dune runtest`). Not a dune run-target and not listed as a dep on any
# dune rule at all, by construction: the weekly deep scan writes to
# dev/health/ and is explicitly out of the per-PR gate surface (see the
# "Does NOT run deep_scan.sh (weekly tool, not a per-PR gate)" comments on
# the deep_scan_*_check.sh structural smoke tests in the dune file). Added
# when check_universe_deps.sh's candidate scan became recursive (#2148
# FLAG-2).
deep_scan/main.sh  # review_at: never (orchestrator entrypoint outside dune runtest by construction, not time-bound)

# Uses the shared _check_lib.sh repo_root() (not a private
# reimplementation) to locate the config-default surface files and
# .github/workflows/. Governed by goldens_affected_check_test.sh's dune
# rule (issue #2393): every invocation in that test overrides REPO_ROOT
# to a freshly-created temp git-repo fixture (9 scenarios), never the
# real repo tree -- same exemption shape and evidence as
# record_qc_audit.sh above. The script is also never a dune run-target
# itself (it takes positional <base-ref> <head-ref> CLI args that only
# make sense against a real PR diff; see the dune file's comment on that
# rule), so the only invocations that exist are either this test or the
# goldens-affected.yml GHA job, neither of which is `dune runtest`.
goldens_affected_check.sh  # review_at: never (architectural invariant of the test's fixture-override wiring, not time-bound)
